# /etc/nginx/sites-available/zero-to-tech  （或 conf.d/zero-to-tech.conf）
#
# 两件事必须做对，否则 TextLab 页会出现「分析失败：404」：
#   1) location /   里用 try_files 的 $uri.html，把 /text-lab 映射到 text-lab.html
#   2) location /api/ 把请求转给 FastAPI，别让 Nginx 当成静态文件去找
#
# 改完执行：
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name example.com;          # ← 换成你的域名或服务器 IP

    root /var/www/zero-to-tech/out;   # ← 换成你 out/ 目录的实际位置
    index index.html;

    # 前端页面：静态导出产出的是 text-lab.html，而链接 href 是 /text-lab
    # 少了 $uri.html 这一项，访问 /text-lab 就是 404
    location / {
        try_files $uri $uri.html $uri/ /404.html;
    }

    # 后端接口：原样转发到 FastAPI（注意 proxy_pass 后面不要加斜杠）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 静态资源长缓存；index.html 和 404.html 不缓存，避免发版后拿到旧壳
    location /_next/static/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /404.html {
        add_header Cache-Control "no-cache";
    }
}
